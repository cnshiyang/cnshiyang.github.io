<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Graduate cat</title>
  <defs>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52647a"/>
      <stop offset="1" stop-color="#2d3d52"/>
    </linearGradient>
  </defs>

  <g transform="translate(64 64) scale(1.18) translate(-64 -64)" stroke="#26384d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tail sits behind the body. -->
    <path d="M82 101c15 2 25-5 26-16 .6-7-3-10-7-8-5 2-3 10-4 14-1 5-5 8-10 9" fill="#fffdfa"/>

    <!-- Cat silhouette, with the original upright sitting pose. -->
    <path d="M34 54c-3-9-4-20 0-25 2-3 9 3 13 8 5-3 11-5 17-5s12 2 17 5c4-5 11-11 14-8 4 5 3 17 0 25 5 4 7 10 6 17-1 8-6 14-14 17 4 7 5 16 0 23-4 6-13 7-18 1-2 5-8 7-12 2-4 5-10 3-12-2-8 3-15-1-16-9-1-6 3-12 9-16-8-3-13-9-12-18 0-6 3-11 8-15Z" fill="#fffdfa"/>

    <!-- Inner ears. -->
    <path d="m36 34 9 8-8 5Z" fill="#f6b9ae" stroke="none"/>
    <path d="m92 34-9 8 8 5Z" fill="#f6b9ae" stroke="none"/>

    <!-- Face. -->
    <circle cx="48" cy="65" r="4.8" fill="#2e4056" stroke="none"/>
    <circle cx="80" cy="65" r="4.8" fill="#2e4056" stroke="none"/>
    <ellipse cx="42" cy="75" rx="5.5" ry="3.2" fill="#f7c8bf" stroke="none"/>
    <ellipse cx="86" cy="75" rx="5.5" ry="3.2" fill="#f7c8bf" stroke="none"/>
    <path d="M58 74c1 4 5 4 6 1 1 3 5 3 6-1" fill="none"/>

    <!-- Whiskers. -->
    <path d="M39 69H25m15 7-13 3m62-10h14m-15 7 13 3" fill="none"/>

    <!-- Front paws. -->
    <path d="M47 96c1 9 2 16 10 18m14-18c-1 9-2 16-10 18" fill="none"/>

    <!-- Graduation cap. -->
    <path d="M43 33v12c12 8 30 8 42 0V33" fill="url(#hat)"/>
    <path d="m64 15 34 15-34 16-34-16Z" fill="url(#hat)"/>
    <path d="m64 20 25 11" fill="none" opacity=".26"/>
    <path d="M91 31v16" fill="none"/>
    <circle cx="91" cy="48" r="3" fill="#26384d"/>
    <path d="m91 51-4 10m4-10v11m0-11 4 10" fill="none"/>
  </g>
</svg>
